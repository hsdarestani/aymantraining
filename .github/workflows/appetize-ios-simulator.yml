name: BE DIFFERENT Appetize iOS Simulator ZIP
on:
  push:
    branches:
      - feature/athlete-experience-oct14
      - main
    paths:
      - .github/workflows/appetize-ios-simulator.yml
  pull_request:
    paths:
      - .github/workflows/appetize-ios-simulator.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bedifferent-appetize-preview
  cancel-in-progress: false
jobs:
  ios-appetize:
    runs-on: macos-15
    timeout-minutes: 115
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Dependencies and typecheck
        run: |
          npm ci --include=dev
          npm run typecheck
          grep -Fq 'Math.max(insets.bottom,12)' 'app/(tabs)/_layout.tsx'
          echo "App version: $(node -p 'require("./app.json").expo.version')"
          echo "iOS build: $(node -p 'require("./app.json").expo.ios.buildNumber')"
          echo "Source SHA: $(git rev-parse HEAD)"
      - name: Generate native simulator project
        env:
          FIREBASE_IOS_GOOGLE_SERVICE_INFO_B64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_B64 }}
        run: |
          node scripts/prepare-native-config.mjs
          # The remote iPhone simulator cannot test watchOS companions.
          # Exclude only watchOS-specific targets for this Appetize preview build.
          rm -rf targets/watch targets/watch-widget
          CI=1 npx expo prebuild --platform ios --clean --non-interactive
      - name: Build self-contained iOS Simulator Release app
        run: |
          set -euo pipefail
          cd ios
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')"
          echo "Building scheme $scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/be-different-appetize CODE_SIGNING_ALLOWED=NO build > /tmp/be-different-appetize-build.log 2>&1 || { grep -nE 'error:|fatal error:|SwiftCompile.*failed|BUILD FAILED' /tmp/be-different-appetize-build.log | tail -n 70 || true; tail -n 100 /tmp/be-different-appetize-build.log; exit 1; }
          app="$(find /tmp/be-different-appetize/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -d "$app"
          test -s "$app/main.jsbundle"
          # A simulator app built with CODE_SIGNING_ALLOWED=NO cannot access
          # iOS Keychain. Expo SecureStore then throws errSecMissingEntitlement
          # when login attempts to read/write its session token.
          # Give only the simulator preview an ad-hoc signature and a dedicated
          # Keychain access group. Store builds use their normal Apple signing.
          entitlements="$(mktemp /tmp/bedifferent-simulator-entitlements.XXXXXX)"
          python3 - "$entitlements" <<'PY'
          import plistlib
          import sys
          team = "884MVA2MD5"
          bundle = "com.smarbiz.bedifferent"
          plist = {
              "application-identifier": f"{team}.{bundle}",
              "com.apple.developer.team-identifier": team,
              "keychain-access-groups": [f"{team}.{bundle}"],
          }
          with open(sys.argv[1], "wb") as f:
              plistlib.dump(plist, f)
          PY
          if test -d "$app/Frameworks/hermes.framework"; then
            codesign --force --sign - "$app/Frameworks/hermes.framework"
          fi
          if test -d "$app/PlugIns/widget.appex"; then
            codesign --force --sign - "$app/PlugIns/widget.appex"
          fi
          codesign --force --sign - --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > /tmp/bedifferent-simulator-signed-entitlements.plist 2>/dev/null
          python3 - /tmp/bedifferent-simulator-signed-entitlements.plist <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as f:
              granted = plistlib.load(f)
          group = "884MVA2MD5.com.smarbiz.bedifferent"
          assert group in granted.get("keychain-access-groups", []), granted
          print("Verified simulator Keychain entitlement:", group)
          PY
          mkdir -p build/appetize
          ditto -c -k --sequesterRsrc --keepParent "$app" build/appetize/BE-DIFFERENT-iOS-Appetize-Simulator.zip
          unzip -t build/appetize/BE-DIFFERENT-iOS-Appetize-Simulator.zip | tail -n 3
          echo "APPETIZE_ZIP=$(pwd)/build/appetize/BE-DIFFERENT-iOS-Appetize-Simulator.zip" >> "$GITHUB_ENV"
      - name: Upload simulator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BE-DIFFERENT-Appetize-iOS-Simulator
          path: mobile/ios/build/appetize/BE-DIFFERENT-iOS-Appetize-Simulator.zip
          if-no-files-found: error
          retention-days: 7
