name: Security patch Next 15.5.28 lockfile for isolated release
on:
  push:
    branches: [security/next-15-5-28-sharedhost-release-20261022]
    paths: [.github/workflows/next-15-5-28-security-lockfile.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update exact patched Next version with authentic npm lockfile integrities
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.28
          npm ci
          npm audit --omit=dev --audit-level=high
          DATABASE_URL=postgresql://test:test@127.0.0.1:5432/test npm run check
      - name: Commit audited dependency fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "No changes needed"; exit 0; }
          git commit -m "security: patch Next.js to 15.5.28 and refresh authentic npm lockfile"
          git push origin HEAD:security/next-15-5-28-sharedhost-release-20261022
