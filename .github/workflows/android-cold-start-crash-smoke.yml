name: BE DIFFERENT Android Cold Start Crash Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/lib/push.ts
      - mobile/app/_layout.tsx
      - mobile/components/LaunchIntro.tsx
      - .github/workflows/android-cold-start-crash-smoke.yml
      - mobile/scripts/ci/step15-android-cold-start.sh

permissions:
  contents: read

concurrency:
  group: bedifferent-android-cold-start
  cancel-in-progress: true

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup KVM
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM device unavailable, emulator runner will report if it cannot boot."
          fi
      - name: Install and prebuild
        run: |
          npm ci
          CI=1 npx expo prebuild --platform android --clean --non-interactive
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleDebug
      - name: Validate reused cold-start script
        run: bash -n scripts/ci/step15-android-cold-start.sh
      - name: Repeated cold starts and Android crash capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: false
          working-directory: mobile
          script: bash scripts/ci/step15-android-cold-start.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bedifferent-android-launch-logcat
          path: mobile/build/step15
          retention-days: 7
