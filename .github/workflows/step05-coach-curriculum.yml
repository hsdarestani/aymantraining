name: BE DIFFERENT Step 05 Coach Curriculum QA
on:
  push:
    branches:
      - feature/bedifferent-step05-coach-curriculum
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "lib/journey-editor-*"
      - "app/admin/journeys/**"
      - "app/api/admin/journeys/**"
      - "scripts/test-journey-step05.mjs"
      - ".github/workflows/step05-coach-curriculum.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bedifferent_test
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: bedifferent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bedifferent:bedifferent_test@127.0.0.1:5432/bedifferent_test?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
      JOURNEY_EDITOR_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate schema and types
        run: npm run check
      - name: Seed preceding structure and safely add version timestamp
        run: |
          git show origin/main:prisma/schema.prisma > prisma/step05-previous.prisma
          npx prisma db push --schema prisma/step05-previous.prisma
          node scripts/test-journey-legacy.mjs seed
          node scripts/test-journey-step05-migration.mjs seed
          npx prisma migrate diff --from-schema-datamodel prisma/step05-previous.prisma --to-schema-datamodel prisma/schema.prisma --script > /tmp/step05-schema.sql
          if grep -Ei 'DROP (TABLE|COLUMN|TYPE)|ALTER TABLE .* DROP' /tmp/step05-schema.sql; then
            echo "Destructive DDL forbidden" >&2
            exit 1
          fi
          npx prisma db push
          node scripts/test-journey-legacy.mjs verify
          node scripts/test-journey-step05-migration.mjs verify
      - name: Database lifecycle and publishing protection
        run: node scripts/test-journey-step05.mjs
      - name: Existing journey integrity
        run: node scripts/test-journey-step03.mjs
      - name: Production build
        run: npm run build
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Start isolated Next.js app
        run: |
          NODE_ENV=production npm start > /tmp/step05-web.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/admin/journeys >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/step05-web.log
          exit 1
      - name: Coach UI and authorization browser tests
        run: npx playwright test tests/browser/step05-journey-editor.spec.mjs --workers=1
      - name: Upload browser diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step05-coach-browser-qa
          path: |
            playwright-report
            test-results
      - name: Print server errors
        if: failure()
        run: cat /tmp/step05-web.log || true
