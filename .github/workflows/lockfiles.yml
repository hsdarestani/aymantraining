name: Generate Lockfiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "mobile/package.json"
      - ".github/workflows/lockfiles.yml"

permissions:
  contents: write

concurrency:
  group: bedifferent-lockfiles-v2
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'bedifferent-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          cd mobile
          npm install --package-lock-only --ignore-scripts
      - name: Commit latest lockfiles
        run: |
          git config user.name "bedifferent-ci"
          git config user.email "ci@bedifferent.local"
          git add package-lock.json mobile/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: lock direct store dependencies"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
