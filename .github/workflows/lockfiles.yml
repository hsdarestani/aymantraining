name: Generate Lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lockfiles.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          cd mobile
          npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        run: |
          git config user.name "bedifferent-ci"
          git config user.email "ci@bedifferent.local"
          git add package-lock.json mobile/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: lock web and native dependencies"
          git push origin HEAD:main
