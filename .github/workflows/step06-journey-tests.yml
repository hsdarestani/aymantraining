name: BE DIFFERENT Step 06 Tests and Review
on:
  push:
    branches:
      - feature/bedifferent-step06-tests-review
  pull_request:
    paths:
      - "lib/journey-service.ts"
      - "lib/journey-test-*.ts"
      - "app/api/journey/tests/**"
      - "app/api/admin/journey-tests/**"
      - "app/journey/tests/**"
      - "app/admin/journey-tests/**"
      - "mobile/app/journey-tests.tsx"
      - "scripts/test-journey-step06.mjs"
      - ".github/workflows/step06-journey-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exam-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bedifferent_test
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: bedifferent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bedifferent:bedifferent_test@127.0.0.1:5432/bedifferent_test?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
      JOURNEY_TESTS_ENABLED: "true"
      EXPO_PUBLIC_JOURNEY_TESTS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Schema and TypeScript
        run: npm run check
      - name: Create disposable DB (no production writes)
        run: npx prisma db push
      - name: Existing progress engine regression
        run: node scripts/test-journey-step03.mjs
      - name: Step 06 coach review and assessment integration
        run: node scripts/test-journey-step06.mjs
      - name: Production build
        run: npm run build
      - name: Native app TypeScript
        run: |
          cd mobile
          npm ci
          npm run typecheck
