name: Trigger Publisher Release

on:
  push:
    branches: [main]
    paths:
      - "release-request.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bedifferent-publisher-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4

      - name: Read release request
        id: request
        run: |
          enabled="$(jq -r '.enabled // false' release-request.json)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Reject stale or mismatched release metadata
        if: steps.request.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node scripts/test-step15-release-request.mjs --enabled
          test "$GITHUB_REF" = "refs/heads/main"
          echo "Publisher request matches exact mobile version and production bundle."

      - name: Require green CI on exact source before Publisher submission
        if: steps.request.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            "Product Quality Gate"
            "BE DIFFERENT Step 08 Security and Activation Gate"
            "BE DIFFERENT Step 11 Women Dashboard QA"
            "BE DIFFERENT Step 12 Private Cycle Journal QA"
            "BE DIFFERENT Step 13 Verified Streak and Milestones QA"
            "BE DIFFERENT Step 14 Accessible Celebrations QA"
            "BE DIFFERENT Step 15 Release Acceptance"
            "Native App Check"
          )
          for attempt in $(seq 1 120); do
            response="$(curl -fsS --connect-timeout 8 --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            done_count=0
            for check in "${required[@]}"; do
              result="$(printf '%s' "$response" | jq -r --arg name "$check" \
                '[.workflow_runs[] | select(.name==$name) | .conclusion] | first // "pending"')"
              case "$result" in
                success) done_count=$((done_count+1));;
                failure|cancelled|timed_out|action_required|skipped)
                  echo "::error::Release blocked: $check = $result"
                  exit 1;;
                *) ;;
              esac
            done
            if [ "$done_count" -eq "${#required[@]}" ]; then
              echo "All ${#required[@]} required exact-source checks passed."
              exit 0
            fi
            sleep 45
          done
          echo "::error::Timed out waiting for exact-source quality and native checks."
          exit 1

      - name: Queue Publisher builds
        if: steps.request.outputs.enabled == 'true'
        env:
          PUBLISHER_URL: https://publisher.smarbiz.sbs
        run: |
          set -euo pipefail
          token_response="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpublisher.smarbiz.sbs")"
          oidc_token="$(printf '%s' "$token_response" | jq -r '.value')"
          test -n "$oidc_token"
          payload="$(jq --arg sha "$GITHUB_SHA" '.source_commit = $sha | del(.enabled)' release-request.json)"
          # Preserve the Publisher response on validation errors instead of hiding
          # it with curl -f. Never log the OIDC token or full payload.
          status="$(curl -sS --connect-timeout 10 --max-time 60 \
            --retry 4 --retry-delay 6 --retry-connrefused \
            -o /tmp/publisher-response.json -w '%{http_code}' \
            -X POST "${PUBLISHER_URL%/}/apps/automation/release/" \
            -H "X-GitHub-OIDC: $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          echo "Publisher release request HTTP status: $status"
          # Log only the whitelisted server error code and a short detail.
          if [ "$status" != "200" ]; then
            jq -r '"Publisher error: " + (.error // "non_json_response" | tostring) + " · " + ((.detail // "") | tostring | .[0:300])' /tmp/publisher-response.json 2>/dev/null || {
              echo "Publisher returned a non JSON error page"
              head -c 180 /tmp/publisher-response.json | tr '\\n' ' '
            }
            exit 1
          fi
          jq -e '.ok == true' /tmp/publisher-response.json >/dev/null
          jq '{ok,app,version_name,build_number,queued,skipped,release_id}' /tmp/publisher-response.json
