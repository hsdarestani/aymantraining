name: Trigger Publisher Release

on:
  push:
    branches: [main]
    paths:
      - "release-request.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bedifferent-publisher-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read release request
        id: request
        run: |
          enabled="$(jq -r '.enabled // false' release-request.json)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Queue Publisher builds
        if: steps.request.outputs.enabled == 'true'
        env:
          PUBLISHER_URL: https://publisher.smarbiz.sbs
        run: |
          set -euo pipefail
          token_response="$(curl -fsS             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpublisher.smarbiz.sbs")"
          oidc_token="$(printf '%s' "$token_response" | jq -r '.value')"
          test -n "$oidc_token"
          payload="$(jq --arg sha "$GITHUB_SHA" '.source_commit = $sha | del(.enabled)' release-request.json)"
          # Preserve the Publisher response on validation errors instead of hiding
          # it with curl -f. Never log the OIDC token or full payload.
          status="$(curl -sS --connect-timeout 10 --max-time 60 \
            --retry 4 --retry-delay 6 --retry-connrefused \
            -o /tmp/publisher-response.json -w '%{http_code}' \
            -X POST "${PUBLISHER_URL%/}/apps/automation/release/" \
            -H "X-GitHub-OIDC: $oidc_token" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          echo "Publisher release request HTTP status: $status"
          # Log only the whitelisted server error code and a short detail.
          if [ "$status" != "200" ]; then
            jq -r '"Publisher error: " + (.error // "non_json_response" | tostring) + " · " + ((.detail // "") | tostring | .[0:300])' /tmp/publisher-response.json 2>/dev/null || {
              echo "Publisher returned a non JSON error page"
              head -c 180 /tmp/publisher-response.json | tr '\\n' ' '
            }
            exit 1
          fi
          jq -e '.ok == true' /tmp/publisher-response.json >/dev/null
          jq '{ok,app,version_name,build_number,queued,skipped,release_id}' /tmp/publisher-response.json
