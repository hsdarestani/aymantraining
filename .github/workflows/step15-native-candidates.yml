name: BE DIFFERENT Step 15 Native Store Candidates
on:
  push:
    branches: [main, feature/step15-final-qa-release-20261022]
    paths:
      - "mobile/**"
      - "release-request.json"
      - "scripts/test-step15-release-request.mjs"
      - ".github/workflows/step15-native-candidates.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "release-request.json"
      - "scripts/test-step15-release-request.mjs"
      - ".github/workflows/step15-native-candidates.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android installable APK and repeated cold starts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify release version, Firebase configuration and typecheck
        run: |
          node ../scripts/test-step15-release-request.mjs
          npm ci
          npm run typecheck
          node scripts/prepare-native-config.mjs --require-android
          CI=1 npx expo prebuild --platform android --clean --non-interactive
      - name: Build Android installable candidate
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Check Android smoke script syntax
        run: bash -n scripts/ci/step15-android-cold-start.sh
      - name: Enable hardware acceleration for Android emulator
        run: |
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm
          else
            echo "::warning::KVM unavailable, emulator must boot in software."
          fi
      - name: Android emulator cold start 10 times, check fatal crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: false
          working-directory: mobile
          # This action splits a multiline script into separate sh -c calls.
          # Keep a single command and run the checked bash file.
          script: bash scripts/ci/step15-android-cold-start.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BE-DIFFERENT-1.3.2-Build23-Android-debug-APK-and-smoke
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/build/step15/
          retention-days: 14
  ios:
    name: iOS simulator candidate with accessibility and watch companions
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify release identity and dependencies
        run: |
          node ../scripts/test-step15-release-request.mjs
          npm ci
          npm run typecheck
          node scripts/prepare-native-config.mjs --require-ios
      - name: Prepare iOS project and companions
        run: CI=1 npx expo prebuild --platform ios --clean --non-interactive
      - name: Compile and package iOS simulator candidate
        run: |
          set -euo pipefail
          cd ios
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/step15-ios \
            CODE_SIGNING_ALLOWED=NO build >/tmp/step15-ios-build.log 2>&1 || { tail -n 120 /tmp/step15-ios-build.log; exit 1; }
          app="$(find /tmp/step15-ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -d "$app"
          # The simulator bundle is NOT an Apple Store IPA. Ad-hoc-sign it
          # with a local Keychain access group so SecureStore login can work.
          # The Publisher separately performs real distribution signing.
          entitlement_plist="$(mktemp /tmp/bedifferent-step15-entitlement.XXXXXX)"
          python3 - "$entitlement_plist" <<'PY'
          import plistlib,sys
          team="884MVA2MD5"
          bundle="com.smarbiz.bedifferent"
          with open(sys.argv[1],"wb") as file:
              plistlib.dump({
                "application-identifier":f"{team}.{bundle}",
                "com.apple.developer.team-identifier":team,
                "keychain-access-groups":[f"{team}.{bundle}"],
              },file)
          PY
          if test -d "$app/Frameworks/hermes.framework"; then
            codesign --force --sign - "$app/Frameworks/hermes.framework"
          fi
          if test -d "$app/PlugIns/widget.appex"; then
            codesign --force --sign - "$app/PlugIns/widget.appex"
          fi
          codesign --force --sign - --entitlements "$entitlement_plist" "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p build/step15
          ditto -c -k --sequesterRsrc --keepParent "$app" build/step15/BE-DIFFERENT-1.3.2-Build23-iOS-Simulator.zip
          unzip -t build/step15/BE-DIFFERENT-1.3.2-Build23-iOS-Simulator.zip | tail -n 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BE-DIFFERENT-1.3.2-Build23-iOS-Simulator
          path: mobile/ios/build/step15/BE-DIFFERENT-1.3.2-Build23-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
