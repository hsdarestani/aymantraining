name: BE DIFFERENT Step 12 Private Cycle Journal QA
on:
  push:
    branches: [feature/step12-private-cycle-journal-20261022, main]
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "lib/cycle-*"
      - "app/cycle/**"
      - "app/api/cycle/**"
      - "app/api/athlete-context/**"
      - "app/api/mobile/dashboard/**"
      - "app/api/privacy/**"
      - "app/settings/**"
      - "app/dashboard/**"
      - "lib/recommendations.ts"
      - "mobile/app/cycle.tsx"
      - "mobile/app/context.tsx"
      - "mobile/app/(tabs)/index.tsx"
      - "scripts/test-step12-cycle-contract.mjs"
      - "tests/browser/step12-cycle-journal.spec.mjs"
      - ".github/workflows/step12-cycle-journal.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bedifferent_test
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://bedifferent:test@127.0.0.1:5432/bedifferent_test?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
      CYCLE_JOURNAL_ENABLED: "true"
      JOURNEY_ONBOARDING_ENABLED: "false"
      WOMEN_DASHBOARD_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/test-step12-cycle-contract.mjs
      - run: node scripts/check-visible-copy.mjs
      - run: npm run check
      - run: npx prisma db push
      - run: npm run build
      - run: cd mobile && npm ci && npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Start isolated web
        run: |
          NODE_ENV=production npm start > /tmp/step12-next.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/step12-next.log
          exit 1
      - run: npx playwright test tests/browser/step12-cycle-journal.spec.mjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step12-cycle-artifacts
          path: |
            test-results
            playwright-report
      - if: failure()
        run: cat /tmp/step12-next.log || true
