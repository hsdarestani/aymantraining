name: BE DIFFERENT Legacy Docker Activation Disabled
# The production service is /opt/bedifferent-temp/current on the shared A+ Esthetic VPS,
# NOT /opt/bedifferent Docker. Activation is owned by the isolated workflow in
# hsdarestani/a_esthetic with its existing SERVER_HOST/USER/SSH_KEY credentials.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prevent-wrong-host:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete Docker deployment
        run: |
          echo "Obsolete Docker activation disabled. The live app is systemd bedifferent-temp on Esthetic's shared VPS."
          echo "Use the audited, backup-first isolated Esthetic-host release workflow."
          exit 1
