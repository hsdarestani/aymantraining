name: BE DIFFERENT Step 03 Journey Integrity
on:
  push:
    branches:
      - feature/bedifferent-step03-progression-domain
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "lib/journey-*.ts"
      - "scripts/test-journey-step03.mjs"
      - ".github/workflows/step03-journey.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bedifferent_test
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: bedifferent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bedifferent:bedifferent_test@127.0.0.1:5432/bedifferent_test?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate schema and TypeScript
        run: npm run check
      - name: Recreate legacy schema with existing data
        run: |
          git show origin/main:prisma/schema.prisma > prisma/legacy-journey-schema.prisma
          npx prisma db push --schema prisma/legacy-journey-schema.prisma
          node scripts/test-journey-legacy.mjs seed
      - name: Reject destructive DDL
        run: |
          npx prisma migrate diff --from-schema-datamodel prisma/legacy-journey-schema.prisma --to-schema-datamodel prisma/schema.prisma --script > /tmp/bedifferent-step03-migration.sql
          if grep -Ei 'DROP (TABLE|COLUMN|TYPE)|ALTER TABLE .* DROP' /tmp/bedifferent-step03-migration.sql; then
            echo "Destructive migration statements are not allowed" >&2
            exit 1
          fi
      - name: Apply additive schema to existing rows
        run: npx prisma db push
      - name: Verify existing records survive
        run: node scripts/test-journey-legacy.mjs verify
      - name: Verify pathway lifecycle and legacy data
        run: node scripts/test-journey-step03.mjs
      - name: Existing feature contracts
        run: node scripts/test-feature-contracts.mjs
      - name: Compile production app
        run: npm run build
