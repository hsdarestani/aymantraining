name: BE DIFFERENT Step 02 Prototype Acceptance
on:
  push:
    branches:
      - feature/bedifferent-step02-clickable-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bedifferent_test
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: bedifferent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bedifferent:bedifferent_test@127.0.0.1:5432/bedifferent_test?schema=public
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate schema and TypeScript
        run: npm run check
      - name: Prepare isolated database
        run: npx prisma db push
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          NODE_ENV=production npm start > /tmp/bedifferent-step02.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/prototype/step-02 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/bedifferent-step02.log
          exit 1
      - name: Verify prototype journeys
        run: npx playwright test tests/browser/step02-prototype.spec.mjs
      - name: Upload QA traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedifferent-step02-prototype-qa
          path: |
            playwright-report
            test-results
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/bedifferent-step02.log || true
