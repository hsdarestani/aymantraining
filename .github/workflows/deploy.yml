name: Deploy BE DIFFERENT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bedifferent-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script_stop: false
          command_timeout: 25m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y git nginx openssl curl docker.io docker-compose-v2 || true
            systemctl enable --now docker
            systemctl enable --now nginx

            if command -v ufw >/dev/null 2>&1; then
              ufw allow 22/tcp || true
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi

            if [ ! -d /opt/bedifferent/.git ]; then
              rm -rf /opt/bedifferent
              git clone https://github.com/hsdarestani/aymantraining.git /opt/bedifferent
            fi

            cd /opt/bedifferent
            git fetch origin main
            git reset --hard origin/main

            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build --remove-orphans
            else
              docker-compose up -d --build --remove-orphans
            fi

            mkdir -p /etc/nginx/ssl/bedifferent
            if [ ! -s /etc/nginx/ssl/bedifferent/fullchain.pem ] || [ ! -s /etc/nginx/ssl/bedifferent/privkey.pem ]; then
              openssl req -x509 -nodes -newkey rsa:2048 -days 825                 -keyout /etc/nginx/ssl/bedifferent/privkey.pem                 -out /etc/nginx/ssl/bedifferent/fullchain.pem                 -subj "/CN=bedifferent.smarbiz.sbs"
            fi

            cat >/etc/nginx/sites-available/bedifferent.smarbiz.sbs <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name bedifferent.smarbiz.sbs;

              location / {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
              }
            }

            server {
              listen 443 ssl;
              listen [::]:443 ssl;
              http2 on;
              server_name bedifferent.smarbiz.sbs;

              ssl_certificate /etc/nginx/ssl/bedifferent/fullchain.pem;
              ssl_certificate_key /etc/nginx/ssl/bedifferent/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              client_max_body_size 100m;

              location / {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
              }
            }
            NGINX

            ln -sfn /etc/nginx/sites-available/bedifferent.smarbiz.sbs /etc/nginx/sites-enabled/bedifferent.smarbiz.sbs
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl restart nginx

            sleep 3
            curl -fsS http://127.0.0.1:3100/api/health
            curl -fsS -H 'Host: bedifferent.smarbiz.sbs' http://127.0.0.1/api/health
            curl -kfsS -H 'Host: bedifferent.smarbiz.sbs' https://127.0.0.1/api/health

      - name: Verify origin from outside
        env:
          ORIGIN_HOST: ${{ secrets.HOST }}
        run: |
          set -e
          curl -kfsS --connect-timeout 10 --resolve bedifferent.smarbiz.sbs:443:$ORIGIN_HOST https://bedifferent.smarbiz.sbs/api/health

      - name: Verify through Cloudflare
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -kfsS --connect-timeout 10 https://bedifferent.smarbiz.sbs/api/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
