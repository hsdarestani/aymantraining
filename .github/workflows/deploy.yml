name: Deploy BE DIFFERENT

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bedifferent-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
          REVENUECAT_IOS_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_IOS_PUBLIC_API_KEY }}
          REVENUECAT_ANDROID_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_API_KEY }}
          REVENUECAT_PRO_ENTITLEMENT: ${{ secrets.REVENUECAT_PRO_ENTITLEMENT }}
          REVENUECAT_ELITE_ENTITLEMENT: ${{ secrets.REVENUECAT_ELITE_ENTITLEMENT }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CLOUDFLARE_ORIGIN_CERT_B64: ${{ secrets.CLOUDFLARE_ORIGIN_CERT_B64 }}
          CLOUDFLARE_ORIGIN_KEY_B64: ${{ secrets.CLOUDFLARE_ORIGIN_KEY_B64 }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: FIREBASE_SERVICE_ACCOUNT_B64,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,REVENUECAT_WEBHOOK_SECRET,REVENUECAT_SECRET_API_KEY,REVENUECAT_IOS_PUBLIC_API_KEY,REVENUECAT_ANDROID_PUBLIC_API_KEY,REVENUECAT_PRO_ENTITLEMENT,REVENUECAT_ELITE_ENTITLEMENT,EXPO_PUSH_ACCESS_TOKEN,RESEND_API_KEY,EMAIL_FROM,POSTHOG_KEY,SENTRY_DSN,CLOUDFLARE_ORIGIN_CERT_B64,CLOUDFLARE_ORIGIN_KEY_B64
          script_stop: false
          command_timeout: 30m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y git nginx openssl curl docker.io docker-compose-v2 || true
            systemctl enable --now docker nginx

            if command -v ufw >/dev/null 2>&1; then
              ufw allow 22/tcp || true
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
            fi

            if [ ! -d /opt/bedifferent/.git ]; then
              rm -rf /opt/bedifferent
              git clone https://github.com/hsdarestani/aymantraining.git /opt/bedifferent
            fi

            cd /opt/bedifferent
            git fetch origin main
            git reset --hard origin/main

            touch .env.production
            chmod 600 .env.production
            if ! grep -q '^DB_PASSWORD=' .env.production; then printf 'DB_PASSWORD=%s\\n' "$(openssl rand -hex 32)" >> .env.production; fi
            if ! grep -q '^CRON_SECRET=' .env.production; then printf 'CRON_SECRET=%s\\n' "$(openssl rand -hex 32)" >> .env.production; fi

            upsert_env() {
              key="$1"; value="$2"
              if [ -n "$value" ]; then
                tmp="$(mktemp)"
                grep -v "^$key=" .env.production > "$tmp" || true
                printf '%s=%s\\n' "$key" "$value" >> "$tmp"
                mv "$tmp" .env.production
                chmod 600 .env.production
              fi
            }
            upsert_env FIREBASE_SERVICE_ACCOUNT_B64 "$FIREBASE_SERVICE_ACCOUNT_B64"
            upsert_env R2_ACCOUNT_ID "$R2_ACCOUNT_ID"
            upsert_env R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
            upsert_env R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
            upsert_env R2_BUCKET "$R2_BUCKET"
            upsert_env REVENUECAT_WEBHOOK_SECRET "$REVENUECAT_WEBHOOK_SECRET"
            upsert_env REVENUECAT_SECRET_API_KEY "$REVENUECAT_SECRET_API_KEY"
            upsert_env REVENUECAT_IOS_PUBLIC_API_KEY "$REVENUECAT_IOS_PUBLIC_API_KEY"
            upsert_env REVENUECAT_ANDROID_PUBLIC_API_KEY "$REVENUECAT_ANDROID_PUBLIC_API_KEY"
            upsert_env REVENUECAT_PRO_ENTITLEMENT "$REVENUECAT_PRO_ENTITLEMENT"
            upsert_env REVENUECAT_ELITE_ENTITLEMENT "$REVENUECAT_ELITE_ENTITLEMENT"
            upsert_env EXPO_PUSH_ACCESS_TOKEN "$EXPO_PUSH_ACCESS_TOKEN"
            upsert_env RESEND_API_KEY "$RESEND_API_KEY"
            upsert_env EMAIL_FROM "$EMAIL_FROM"
            upsert_env POSTHOG_KEY "$POSTHOG_KEY"
            upsert_env SENTRY_DSN "$SENTRY_DSN"

            docker compose --env-file .env.production up -d db
            docker compose --env-file .env.production run --rm migrate
            docker compose --env-file .env.production up -d --build --remove-orphans web scheduler

            mkdir -p /etc/nginx/ssl/bedifferent
            if [ -n "$CLOUDFLARE_ORIGIN_CERT_B64" ] && [ -n "$CLOUDFLARE_ORIGIN_KEY_B64" ]; then
              printf '%s' "$CLOUDFLARE_ORIGIN_CERT_B64" | base64 -d > /etc/nginx/ssl/bedifferent/fullchain.pem
              printf '%s' "$CLOUDFLARE_ORIGIN_KEY_B64" | base64 -d > /etc/nginx/ssl/bedifferent/privkey.pem
              chmod 600 /etc/nginx/ssl/bedifferent/privkey.pem
            elif [ ! -s /etc/nginx/ssl/bedifferent/fullchain.pem ] || [ ! -s /etc/nginx/ssl/bedifferent/privkey.pem ]; then
              openssl req -x509 -nodes -newkey rsa:2048 -days 825 -keyout /etc/nginx/ssl/bedifferent/privkey.pem -out /etc/nginx/ssl/bedifferent/fullchain.pem -subj "/CN=bedifferent.smarbiz.sbs"
            fi

            cat >/etc/nginx/sites-available/bedifferent.smarbiz.sbs <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name bedifferent.smarbiz.sbs;
              client_max_body_size 110m;
              location / {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
              }
            }
            server {
              listen 443 ssl;
              listen [::]:443 ssl;
              http2 on;
              server_name bedifferent.smarbiz.sbs;
              client_max_body_size 110m;
              ssl_certificate /etc/nginx/ssl/bedifferent/fullchain.pem;
              ssl_certificate_key /etc/nginx/ssl/bedifferent/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
              location / {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 180s;
              }
            }
            NGINX

            ln -sfn /etc/nginx/sites-available/bedifferent.smarbiz.sbs /etc/nginx/sites-enabled/bedifferent.smarbiz.sbs
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl restart nginx
            sleep 4
            curl -fsS http://127.0.0.1:3100/api/health
            curl -fsS http://127.0.0.1:3100/api/ready

      - name: Verify origin from outside
        env:
          ORIGIN_HOST: ${{ secrets.HOST }}
        run: |
          set -e
          curl -kfsS --connect-timeout 10 --resolve bedifferent.smarbiz.sbs:443:$ORIGIN_HOST https://bedifferent.smarbiz.sbs/api/ready

      - name: Verify through Cloudflare
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -kfsS --connect-timeout 10 https://bedifferent.smarbiz.sbs/api/ready; then exit 0; fi
            sleep 5
          done
          exit 1
