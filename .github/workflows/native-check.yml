name: Native App Check

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/native-check.yml"
  workflow_dispatch:

concurrency:
  group: bedifferent-native-check-v2-v2
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native dependencies
        run: npm ci
      - name: Verify native stack
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/react-native-nitro-modules']?.version!=='0.35.6') process.exit(3)"
          grep -q '"kotlinVersion": "2.1.20"' app.json
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo config validation
        run: npx expo config --type public >/tmp/expo-config.json
      - name: Android prebuild validation
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Android Gradle smoke
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleDebug

      - name: Verify Firebase modules
        run: |
          test -d node_modules/@react-native-firebase/app
          test -d node_modules/@react-native-firebase/messaging
      - name: Validate release scripts
        run: |
          bash -n scripts/build-android.sh
          bash -n scripts/build-ios.sh
          node --check scripts/configure-android-signing.mjs

  wearos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Wear OS debug
        run: gradle -p mobile/wearos :app:assembleDebug --no-daemon

  ios-companions:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native dependencies
        run: npm ci
      - name: Generate iOS project with Watch and widgets
        run: CI=1 npx expo prebuild --platform ios --clean
      - name: Verify companion targets
        run: |
          xcodebuild -project ios/*.xcodeproj -list | tee /tmp/xcode-targets.txt
          grep -qi "watch" /tmp/xcode-targets.txt
          grep -qi "widget" /tmp/xcode-targets.txt
