name: Native App Check

on:
  push:
    branches: [main, "completion/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/native-check.yml"
  workflow_dispatch:

concurrency:
  group: bedifferent-native-check-v2-v2
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native dependencies
        run: npm ci
      - name: Verify native stack
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/react-native-nitro-modules']?.version!=='0.35.6') process.exit(3)"
          grep -q '"kotlinVersion": "2.1.20"' app.json
      - name: Verify Firebase compatibility with RN 0.79
        run: |
          node -e "for (const name of ['app', 'messaging']) { const version = require('@react-native-firebase/' + name + '/package.json').version; if (version !== '23.8.6') throw new Error('Firebase ' + name + ' must use the RN 0.79 compatible release'); }"
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo config validation
        run: npx expo config --type public >/tmp/expo-config.json
      - name: Android prebuild validation
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Android Gradle smoke
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleDebug

      - name: Verify Firebase modules
        run: |
          test -d node_modules/@react-native-firebase/app
          test -d node_modules/@react-native-firebase/messaging
      - name: Validate release scripts
        run: |
          bash -n scripts/build-android.sh
          bash -n scripts/build-ios.sh
          node --check scripts/configure-android-signing.mjs

  wearos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Wear OS debug
        run: gradle -p mobile/wearos :app:assembleDebug --no-daemon

  ios-companions:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native dependencies
        run: npm ci
      - name: Generate iOS project with Watch and widgets
        run: CI=1 npx expo prebuild --platform ios --clean
      - name: Verify companion targets
        run: |
          xcodebuild -project ios/*.xcodeproj -list | tee /tmp/xcode-targets.txt
          grep -qi "watch" /tmp/xcode-targets.txt
          grep -qi "widget" /tmp/xcode-targets.txt
      - name: Compile iOS simulator app and embedded companions
        run: |
          cd ios
          workspace="$(find . -maxdepth 2 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')"
          set -o pipefail
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/bd-ios-derived CODE_SIGNING_ALLOWED=NO build > /tmp/bd-ios-build.log 2>&1 || { tail -n 160 /tmp/bd-ios-build.log; exit 1; }
          tail -n 20 /tmp/bd-ios-build.log
