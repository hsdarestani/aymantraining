name: Native App Check

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/native-check.yml"
  workflow_dispatch:

concurrency:
  group: bedifferent-native-check-v2-v2
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo config validation
        run: npx expo config --type public >/tmp/expo-config.json
      - name: Android prebuild validation
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Android Gradle smoke
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleDebug

      - name: Verify native billing and Firebase modules
        run: |
          grep -R -q 'com.android.vending.BILLING' android/app/src/main/AndroidManifest.xml android/app/build.gradle android || true
          test -d node_modules/react-native-iap
          test -d node_modules/@react-native-firebase/app
          test -d node_modules/@react-native-firebase/messaging
      - name: Validate release scripts
        run: |
          bash -n scripts/build-android.sh
          bash -n scripts/build-ios.sh
          node --check scripts/configure-android-signing.mjs
