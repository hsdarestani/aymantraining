name: BE DIFFERENT Step 09 Daily Coach QA
on:
  push:
    branches: [feature/bedifferent-step09-daily-coach]
  pull_request:
    paths:
      - 'prisma/**'
      - 'lib/step09-coaching.ts'
      - 'app/api/step09/**'
      - 'app/api/admin/technique-reviews/**'
      - 'app/dashboard/**'
      - 'app/admin/technique-reviews/**'
      - 'mobile/**'
      - 'scripts/test-journey-step09.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  athlete-coach:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bedifferent_test
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: bedifferent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://bedifferent:bedifferent_test@127.0.0.1:5432/bedifferent_test?schema=public
      NODE_ENV: test
      STEP09_ENABLED: "true"
      EXPO_PUBLIC_STEP09_ENABLED: "true"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck backend and web
        run: npm run check
      - name: Migrate disposable PostgreSQL
        run: npx prisma db push
      - name: Step 09 coach integration
        run: node scripts/test-journey-step09.mjs
      - name: Regression for existing Journey Levels
        run: node scripts/test-journey-step03.mjs
      - name: Build production web
        run: npm run build
      - name: Native app TypeScript
        run: |
          cd mobile
          npm ci
          npm run typecheck
      - name: Browser runtime
        run: npx playwright install --with-deps chromium
      - name: Start test server
        run: |
          NODE_ENV=production npm start > /tmp/step09-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/step09-next.log
          exit 1
      - name: Athlete and coach live browser review
        run: npx playwright test tests/browser/step09-coach.spec.mjs --workers=1
      - name: Preserve browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step09-coach-browser
          path: |
            playwright-report
            test-results
      - name: Logs on failure
        if: failure()
        run: cat /tmp/step09-next.log || true
